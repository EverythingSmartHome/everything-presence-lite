# Publishes existing firmware from gh-pages plus current redirect pages from main.
# Used by firmware publishing and by the independent static-site workflow.
name: Deploy from GH-Pages

on:
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Called by publish.yml after it pushes to gh-pages. A push made with
  # GITHUB_TOKEN does not trigger the push event above, so without this
  # the live site only updated when this workflow was run by hand.
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site

      # Always use current main, including when a long-running firmware build
      # started before a newer static-site change. This checkout is outside _site
      # so source files cannot leak into the uploaded Pages artifact.
      - name: Checkout current site pages
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-source
          sparse-checkout: static

      - name: Overlay current site pages
        run: cp -a site-source/static/. _site/

      - name: Remove git metadata
        run: rm -rf _site/.git

      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
